# PROPÓSITO: configurar nginx para servir la UI ya construida y reenviar al
#   gateway las llamadas a la API. En producción cumple el mismo papel que el
#   proxy de desarrollo de vite.config.js, para que src/api.js use exactamente
#   las mismas rutas relativas en los dos entornos.
#
# DEBE CONTENER:
#   1. Un bloque server escuchando en el puerto 80.
#   2. La raíz apuntando al directorio con los archivos construidos y el
#      index.html por defecto.
#   3. Un location "/" con try_files que caiga siempre en /index.html — sin esto,
#      recargar la página en una ruta interna de React devuelve 404.
#   4. Un location por cada prefijo de la API (/habitaciones, /ordenes,
#      /tecnicos, /asignaciones, /notificaciones, /salud) con proxy_pass hacia
#      el GATEWAY, propagando Host y X-Forwarded-For.
#   5. Compresión gzip para los archivos estáticos.
#   6. Cabeceras de caché: agresiva para los archivos con hash, nula para
#      index.html.
#
# NO DEBE CONTENER:
#   - proxy_pass directo hacia habitaciones, ordenes, tecnicos o notificaciones:
#     el único punto de entrada al backend es el gateway.
#   - Certificados ni configuración de TLS; el proyecto corre en HTTP local.
#   - Reglas de negocio, reescrituras que cambien semántica ni autenticación.
#   - Configuración de PHP, CGI o cualquier módulo que no se use.
#
# RELACIONADO:
#   - Dockerfile (copia este archivo en la etapa final)
#   - vite.config.js (el equivalente para desarrollo)
#   - servicios/gateway (destino de todos los proxy_pass)
#   - src/api.js (usa rutas relativas que este archivo resuelve)
