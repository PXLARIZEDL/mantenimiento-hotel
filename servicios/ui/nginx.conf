# Sirve la UI ya construida y reenvía al gateway las llamadas a la API.
#
# Cumple el mismo papel que el proxy de desarrollo de vite.config.js, para que
# src/api.js use exactamente las mismas rutas relativas en los dos entornos.
#
# Todos los proxy_pass apuntan al GATEWAY. Ninguno va directo a habitaciones,
# ordenes, tecnicos ni notificaciones: el único punto de entrada al backend es
# el gateway.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API: todo al gateway ------------------------------------------------
    # El bloque se repite por prefijo porque nginx elige el location más
    # específico; un solo regex haría más difícil leer qué se está reenviando.

    location /habitaciones { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }
    location /ordenes      { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }
    location /tecnicos     { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }
    location /asignaciones { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }
    location /notificaciones { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }
    location /salud        { proxy_pass http://gateway:8080; include /etc/nginx/conf.d/proxy-comun.inc; }

    # --- Estáticos -----------------------------------------------------------

    # Los archivos con hash en el nombre no cambian nunca: se cachean fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: si se cachea, un despliegue nuevo sigue sirviendo
    # el HTML viejo apuntando a bundles que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # try_files cae siempre en index.html. Sin esto, recargar la página en una
    # ruta interna devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
